# Workspace switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5

# Navigate desktops (prev/next)
bind = SUPER, L, workspace, +1
bind = SUPER, H, workspace, -1

# Window management
bind = SUPER, Q, killactive
bind = SUPER, Down, layoutmsg, preselect d   # or use movewindow
bind = SUPER, Left, layoutmsg, preselect l
bind = SUPER, Right, layoutmsg, preselect r
bind = SUPER CTRL, Left, workspace, -1
bind = SUPER CTRL, Right, workspace, +1

# Tiling / quick tile equivalents
bind = SUPER, Left, resizeactive, -50 0     # or splitratio
bind = SUPER, Right, resizeactive, 50 0

# Window to next/prev monitor
bind = SUPER SHIFT, Right, movewindow, mon:+1
bind = SUPER SHIFT, Left, movewindow, mon:-1

# Minimize / Maximize
bind = SUPER, Prior, fullscreen, 1          # PgUp = maximize
bind = SUPER, Next, movetoworkspacesilent, special  # PgDown = minimize-ish

# Lock screen
bind = SUPER, L, exec, hyprlock

# Terminal (you had Meta+T for Konsole)
bind = SUPER, T, exec, alacritty

# App launcher (you had Alt+Space for KRunner)
bind = ALT, Space, exec, walker            # walker is Omarchy's launcher

# Show desktop
bind = SUPER, D, togglespecialworkspace
